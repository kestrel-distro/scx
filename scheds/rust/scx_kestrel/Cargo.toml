[package]
name = "scx_kestrel"
version = "1.1.4"
authors = ["Kestrel <https://github.com/kestrel-distro>", "Meta"]
edition = "2024"
rust-version = "1.91"
description = "Kestrel's sched_ext scheduler: a fork of scx_layered that classifies tasks by the Kestrel per-task hint (scx_bpf_task_hint) and by cgroup class. https://github.com/kestrel-distro/scx"
license = "GPL-2.0-only"

[dependencies]
anyhow = "1"
bitvec = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env", "unicode", "wrap_help"] }
clap_main = "0.2"
crossbeam = "0.8"
ctrlc = { version = "3", features = ["termination"] }
fastrand = "2"
fb_procfs = "0.9"
inotify = "0.11"
lazy_static = "1"
libbpf-rs = "=0.27.2"
libc = "0.2"
regex = "1"
scx_bpf_compat = { path = "../../../rust/scx_bpf_compat", version = "1.1.4" }
scx_raw_pmu = { path = "../../../rust/scx_raw_pmu", version = "1.1.4" }
scx_stats = { path = "../../../rust/scx_stats", version = "1.1.4" }
scx_stats_derive = { path = "../../../rust/scx_stats/scx_stats_derive", version = "1.1.4" }
scx_utils = { path = "../../../rust/scx_utils", version = "1.1.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "parking_lot", "tracing-log"] }
once_cell = "1"
plain = "0.2"
walkdir = "2"
nvml-wrapper = "0.12"
nix = { version = "0.31", features = ["sched"] }
sysinfo = "0.38"

[dev-dependencies]
scx_utils = { path = "../../../rust/scx_utils", version = "1.1.4", features = ["testutils"] }

[build-dependencies]
scx_cargo = { path = "../../../rust/scx_cargo", version = "1.1.4" }

[features]
enable_backtrace = []

[package.metadata.appimage]
auto_link = true
